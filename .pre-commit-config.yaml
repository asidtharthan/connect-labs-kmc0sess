exclude: '^docs/|/migrations/|^(audit_e2e|build_master_4src|build_payload_agg|build_dashboard_data|build_dashboard_data_audit|build_render_data|brutal_verify|pull_hq_full_payloads|pull_ocs_state|pull_ocs_words|refresh_interviews_dashboard|setup_dashboard_secrets)\.py$'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.9-for-vscode
    hooks:
      - id: prettier
        args: ['--tab-width', '2', '--single-quote']
        # docs/report_freeze/ holds PINNED artefacts whose bytes are recorded as SHA256 in
        # MANIFEST.txt. Reformatting them invalidates every checksum, which is how a manifest
        # generated before the hook ran ended up disagreeing with the file it described.
        exclude: 'commcare_connect/templates/|^docs/report_freeze/'

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.13.0'
    hooks:
      - id: django-upgrade
        args: ['--target-version', '4.1']

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.4.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
