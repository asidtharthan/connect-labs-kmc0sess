name: Refresh Interviews Dashboard

# Daily, hands-off rebuild of the Connect Interviews dashboard (workflow 3962).
# Runs on a GitHub-hosted runner (no PC, no labs deploy): pulls HQ + OCS live, rebuilds the
# validated master, runs the audit gate (aborts on failure), and publishes the render via the
# connect_labs MCP HTTP endpoint.
#
# NO participant data is stored in git. The static Connect leg (funnel + claimed/training) is the
# `connect_user_data_snapshot.csv` reassembled at runtime from gzip+base64 SECRETS, never committed.
# The 10-Jun baseline + GW workbook (participant/reference) are absent here, so the audit runs its
# integrity + self-consistency checks (those baseline/GW reference checks auto-skip).
#
# Required repository secrets (set them all at once with: python setup_dashboard_secrets.py):
#   MCP_BEARER                  - connect_labs MCP token (~/.claude.json connect_labs Authorization, after "Bearer ")
#   HQ_API_KEY, HQ_USERNAME     - CommCare HQ creds (.hq_creds.json)
#   OCS_API_KEY                 - OpenChatStudio bearer key
#   CONNECT_SNAP_1/2/3          - the Connect snapshot, gzip+base64, split in 3 (set by the script)

on:
  schedule:
    - cron: '37 4 * * *' # 04:37 UTC daily — off-peak, odd minute (avoids top-of-hour scheduler congestion that delayed the '0 6' run by ~4h)
  workflow_dispatch: # also runnable on-demand from the Actions tab
    inputs:
      full_resync:
        description: 'Full OCS re-scan (state+words) to self-heal — slower + many more OCS requests; leave off for normal incremental runs'
        type: boolean
        default: false
      allow_regression:
        description: 'Regression-guard escape hatch: comma-separated metric names (or "all") to waive for THIS run only. Use when a change legitimately lowers counts (e.g. a new test-account exclusion). Leave blank normally.'
        type: string
        default: ''

concurrency:
  group: refresh-interviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 50 (not 30) so a one-off FULL OCS rebuild (when the incremental cache is lost/evicted: full
    # session scan ~7min + full word-count fetch of ~9.4k sessions ~25min + build/audit/publish) can
    # complete and re-save the cache. Steady-state incremental runs finish in ~8min; the headroom only
    # matters on the recovery run after a cache miss.
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      INTERVIEWS_CONNECT_SNAPSHOT: '1'
      INTERVIEWS_STRICT_FRESHNESS: '1' # enforce brutal_verify freshness asserts + regression_guard history tiers (CI always live-pulls)
      # Regression-guard escape hatch. Empty on the scheduled run; set only via workflow_dispatch when a
      # deliberate, reviewed change legitimately lowers a monotonic counter. Every use is logged loudly.
      INTERVIEWS_ALLOW_REGRESSION: ${{ inputs.allow_regression }}
      MCP_URL: 'https://labs.connect.dimagi.com/mcp/'
      MCP_BEARER: ${{ secrets.MCP_BEARER }}
      HQ_API_KEY: ${{ secrets.HQ_API_KEY }}
      HQ_USERNAME: ${{ secrets.HQ_USERNAME }}
      OCS_API_KEY: ${{ secrets.OCS_API_KEY }}
      # Headless Connect pull (OAuth refresh-token grant). GH_PAT writes the rotated token back.
      CONNECT_REFRESH_TOKEN: ${{ secrets.CONNECT_REFRESH_TOKEN }}
      CONNECT_OAUTH_CLIENT_ID: ${{ secrets.CONNECT_OAUTH_CLIENT_ID }}
      CONNECT_OAUTH_CLIENT_SECRET: ${{ secrets.CONNECT_OAUTH_CLIENT_SECRET }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-refresh.txt
      # Carry the OCS caches between daily runs so the session/word pulls are INCREMENTAL (only new +
      # recently-changed sessions) instead of re-downloading all ~18k sessions each day. Rolling key:
      # every run saves a fresh cache (unique key) and restores the most recent prior one (restore-keys
      # prefix). A cache miss (first run / eviction) just makes the scripts do a one-off full seed.
      - name: Restore OCS caches (incremental sync state)
        uses: actions/cache@v4
        with:
          path: |
            _ocs_state_cache.json
            _ocs_words_cache.json
          key: ocs-cache-${{ github.run_id }}
          restore-keys: |
            ocs-cache-
      # Carry the regression-guard run history between daily runs. Same rolling-key idiom as the OCS
      # cache above: each run saves under a unique key and restores the most recent prior one.
      # `_run_history.json` is the ONLY persisted record of what yesterday's numbers were — every other
      # gate re-derives its expectations from the same (possibly degraded) sources the dashboard was
      # built from, so without this the pipeline cannot tell "the programme is smaller today" from
      # "a source silently returned fewer rows". It holds aggregate counts only (no participant data),
      # and is written by refresh_interviews_dashboard.py only AFTER a successful publish. A cache miss
      # is harmless: the guard falls back to its absolute floors and re-seeds the history this run.
      - name: Restore regression-guard run history (day-over-day baseline)
        uses: actions/cache@v4
        with:
          path: |
            _run_history.json
          key: run-history-${{ github.run_id }}
          restore-keys: |
            run-history-
      - name: Reassemble Connect snapshot from secrets (FALLBACK if the headless pull fails)
        env:
          CONNECT_SNAP_1: ${{ secrets.CONNECT_SNAP_1 }}
          CONNECT_SNAP_2: ${{ secrets.CONNECT_SNAP_2 }}
          CONNECT_SNAP_3: ${{ secrets.CONNECT_SNAP_3 }}
        run: |
          printf '%s' "${CONNECT_SNAP_1}${CONNECT_SNAP_2}${CONNECT_SNAP_3}" | base64 -d | gunzip > connect_user_data_snapshot.csv || true
          echo "fallback snapshot rows: $(wc -l < connect_user_data_snapshot.csv 2>/dev/null || echo 0)"
      - name: Refresh (Connect headless + HQ + OCS), audit, and publish dashboard
        run: |
          EXTRA=""
          if [ "${{ inputs.full_resync }}" = "true" ]; then EXTRA="--full-resync"; echo "FULL OCS re-scan requested"; fi
          python refresh_interviews_dashboard.py --pull-connect --pull-hq --pull-ocs --pull-words --push $EXTRA
      - name: Clean up snapshot (don't persist participant data on the runner)
        if: always()
        run: rm -f connect_user_data_snapshot.csv
