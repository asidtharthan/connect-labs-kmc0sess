# Judged fresh per-scene against the bundled ddd-concept-eval rubric (Tough
# Judge: adversarial-list first, conservative from 3/5). EXTRA scrutiny applied
# to scenes 3 and 10 because the orchestrator made the two render-recipe/data
# fixes affecting them (self-work bias guard). 11 scenes, 47/47 actions ok,
# pacing audit clean (no dead-air, no recording bugs).

dimensions:
  concept_clarity:
    score: 5
    weight: 0.15
    justification: >-
      A cold outsider can state the product in one sentence: a program manager
      reads three network managers' weekly SOP compliance on one grid (MET vs
      BELOW) and drills any cell down to the flagged worker's audited child-MUAC
      photos + AI coaching transcript. Scene 1 establishes the whole-program
      view; every scene names a concrete role (Priya, the network managers, the
      FLWs) and a concrete task. No deduction rule fires.
  use_case_soundness:
    score: 5
    weight: 0.15
    justification: >-
      Judged on the whole story. The feature does load-bearing work at program
      scale: cross-opp oversight with real accountability chains — coached-to-
      recovery (Kadi), still-investigating (Lola), and AI-caught-misleading-
      photos to suspension (Vida). The AI coach operates on multi-week screening
      patterns, not a trivial one-line input. A skeptical buyer sees non-trivial,
      unique value; not a toy. The one honest scope gap (no per-child MUAC
      trajectory dashboard, G1) is substituted by audit photos + coaching
      outcome and is not overclaimed.
  design_soundness:
    score: 5
    weight: 0.20
    justification: >-
      Every interaction is coherent: grid -> click cell -> inline detail panel
      (no nav away) -> Open the run -> state-aware review table (View vs Create)
      -> View Audit -> per-photo decisions -> View Task -> transcript. State is
      readable at each level (closed-satisfactory / investigating / closed-
      suspended; Save Progress vs Complete Image Review; Close Task on open
      tasks). No dead-ends or contradictory affordances. action_trace: all 47
      effecting actions performed and ok.
  visual_polish:
    score: 5
    weight: 0.12
    justification: >-
      The prior run's ONLY visual_polish deduction was scene 3's clipped
      state-aware Actions column ("View Ta..." truncated at 1440px). Fixed:
      video_viewport_width=1600 now renders the full 12-column analytics table
      with complete Create Audit/Create Task menus and the flagged row's full
      View Audit (blue) + View Task (purple) buttons — verified in scene_3.png.
      Scanning all 11 scenes: tight alignment, intentional type hierarchy,
      semantic color (green SOP MET / amber BELOW / red outcome bar encoding an
      OBJECTIVE threshold verdict, not editorializing), consistent controls,
      legible load-bearing content, honest top-level "KMC (Synthetic)" marker
      (exempt). No deduction rule fires. Softest point (does NOT meet a
      deduction): the scene-3 analytics table is dense — but dense-and-legible
      analytics is appropriate, not a flaw.
  why_groundedness:
    score: 5
    weight: 0.15
    justification: >-
      Every rendered concept_claim traces to a named spine item (S1-S4) and is
      demonstrated in the footage. S4's "individual child's MUAC evidence" is
      grounded by the actual audit photos + per-photo decisions (scene 4) and the
      coaching transcript showing week-over-week recovery (scene 5). The G1
      CAPABILITY gap (no MUAC-trajectory dashboard) is honestly declared and is
      NOT claimed by any scene's narration, so no scene rests on absent evidence.
  claim_reality_coherence:
    score: 5
    weight: 0.10
    blocking: false
    justification: >-
      The prior run's advisory residual (badge over-application: all 5 photos
      labelled "Hyperzoomed" when only ~2 were) is FIXED in live data
      (connect-labs #954). Verified live AND in-render (scene 10): exactly 2
      photos carry the AI "Hyperzoomed" badge (muac_bad_004 conf 0.881,
      muac_bad_005 conf 0.879 — the genuinely framing-obscured ones); the other
      3 human-failed photos carry no AI badge. Scene 9 now shows Vida's fate as
      "closed - suspended" (distinct from Kadi's closed-satisfactory and Lola's
      investigating), and Eastern reads BELOW. Every narration claim is now
      demonstrated; the human note "All 5 photos fail - framing" is broader than
      the 2 AI badges by design (human review vs AI verdict) and is coherent, not
      an overstatement.
  motion_friction:
    score: 5
    weight: 0.13
    justification: >-
      Concept-eval scores the screenshot walkthrough + action_trace + pacing
      audit. Pacing audit clean (0 dead-air, 0 silent-motion, 0 recording bugs).
      Every scene is framed so its narrated artifact is fully in view: the grid
      (1/11), each inline drill panel including Vida's at the viewport bottom (9),
      the full state-aware table (3, helped by the same 1600px fix), the photo
      grids + badges (4/7/10), the transcripts (5/8). No blank/half-loaded
      openings (prewarm on). No hover-only-where-fill-implied gaps. (Video-level
      pacing nuances belong to the Video phase / ddd-video-judge.)

overall_score: 5
overall_rule: lowest

