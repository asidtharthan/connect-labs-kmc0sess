# Aggregated by weakest-link across all nine scenes.
dimensions:
  concept_clarity:
    score: 2
    weight: 0.20
    justification: >
      Bound by scenes 4 and 8. Scene 4's captured frame contains neither half of
      its own concept — no per-category decision, no expiry, no supplier name —
      so a viewer freezing there reads "a queue of three". Scene 8's narrated
      "why it matters" is refuted by the tables directly beneath it: the split is
      the cheapest possible award, not a premium. Elsewhere the concept reads
      cleanly at 3 (the two-stage EOI-to-registry-to-tender model is legible in
      the nav and in the product's own copy).
  use_case_soundness:
    score: 3
    weight: 0.15
    justification: >
      Scored once for the whole walkthrough. The domain is genuinely load-bearing
      — a USD 3.37M, 80,000-carton, two-country lean-season tender in the real
      UNICEF/WFP two-stage shape — and no toy-input rule fires. But the feature is
      repeatedly exercised where its value is least felt: 14 suppliers, a 3-row
      review queue, filters never used, eligibility never demonstrated, and the
      headline "deliberate split" reducing to awarding each lot to its own
      cheapest bidder. A skeptic asks "so the feature is that the Award button is
      per-lot?"
  design_soundness:
    score: 2
    weight: 0.20
    justification: >
      Bound by six of nine scenes. Three scenes narrate an effecting act the trace
      never performs (2 opens/names a round that already existed; 3 has Amina
      "apply and submit" while opening a March record from a different round;
      5 has Ada "filter by commodity and country" with all three selects at
      defaults and the count at the unfiltered 14). Scene 4 makes the decided
      object vanish with no destination. Scene 6 narrates a publish over an
      already-Published tender. Scene 9's contract modal is a dead end in the one
      direction the concept requires, and contradicts its own DISBURSED label.
  visual_polish:
    score: 2
    weight: 0.15
    justification: >
      Bound by scene 9, where the modal clips mid-row at the bottom edge with
      underlying page content occupying the same pixels, there is no scroll
      affordance, and the reconciliation line that is the scene's proof is
      unreachable. Otherwise the craft is consistently decent (3-4): one card
      system, real type hierarchy, semantic green, no contrast failures. Recurring
      3-level notes: light modal scrim leaving background buttons clipped mid-word,
      left-aligned money with cents on seven-figure values, decorative green on
      technical scores, chip/round-name wrap defects in the dashboard table.
  why_groundedness:
    score: 3
    weight: 0.20
    justification: >
      The strongest dimension. Every scene's concept_claim maps to a named spine
      item, and S1/S2/S3/S4 all cite implemented code plus named tests — the
      provenance chain is real and non-trivial. Held to 3 by three scenes where the
      narration reaches beyond the brief: scene 2's "answers the same questions"
      (S0 documents a supply base, not a question set), scene 5's lapse-removes-a-
      supplier (org_can_bid governs bid eligibility, not registry membership), and
      scene 8's cost-of-resilience assertion, which appears nowhere in S4 and is
      the one clause the data refutes.
  claim_reality_coherence:
    score: 2
    weight: 0.10
    blocking: false
    advisory: true
    justification: >
      Advisory, excluded from overall_score. Eight of nine scenes carry a narrated
      claim with no on-screen carrier. The two most consequential: scene 8's
      "splitting costs a little more per carton", which the page's own numbers
      refute by USD 81,000; and scene 9's award-to-contract link, where nothing on
      screen names the source award and the substituted record contradicts the
      claim three ways (quantity, unit price, and deliveries dated before the
      award was made).
  motion_friction:
    score: 2
    weight: 0.15
    justification: >
      Bound by scenes 2, 4, 5 and 6. Scenes 2 and 5 claim actions the trace never
      performs. Scene 4's payoff modal is dismissed before capture, so the frame
      holds none of the scene's content. Scene 6 is the same modal as scene 7 about
      135px apart, so two consecutive scenes narrate different concepts over one
      payload. Scene 7 clips the heading of the very lot it names. Scenes 1 and 8
      are genuinely well-framed at 4 — scene 8's end-frame holds both awarded lots
      and the confirming toast in one settled shot.

overall_score: 2
overall_rule: lowest
overall_rule_note: >
  Minimum across all scenes of the five gating dimensions (concept_clarity,
  design_soundness, visual_polish, why_groundedness, motion_friction).
  claim_reality_coherence is advisory and excluded. use_case_soundness scored
  once for the whole deck (3) and does not move the floor.

