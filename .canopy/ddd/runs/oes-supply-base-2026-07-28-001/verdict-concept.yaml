open_questions_answered:
  scene_9_contract_provenance:
    question: >
      Is the framing now honest about which award scene 9's contract came from?
    answer: "NO"
    evidence: >
      Scene 8 awards a 60,000-carton Maiduguri lot to Savanna Nutrients Ltd at
      USD 42.29. Scene 9 opens OES-C-2026-NG1: Savanna Nutrients Ltd, Maiduguri,
      45,000 cartons, USD 42.10, obligated USD 1,894,500 (= 45,000 x 42.10,
      internally consistent). The recipe's authoring note knows this is the earlier
      Q2 contract — but that note is never spoken and never rendered, and it
      actually asserts the WRONG identity ("the contract the Maiduguri award
      became"). Searching the full scene-9 page text for "RUTF Northeast Nigeria
      Q3 2026", "solicitation", "award", "lot" or "tender" returns nothing: the
      contract record traces down to money and forward to consignments, but the
      upward link to the award — the one relation the scene exists to prove — is
      absent from the UI entirely, even though execution.py models it. A third tell
      settles it independently: the delivery schedule shows 12 consignments
      Delivered Jul 11-21 2026 plus SHP-2026-0302 delivered Jul 27, all BEFORE the
      award just made (today is Jul 28, 2026 per the runs-dry dates). A contract
      created by that award cannot have completed deliveries a fortnight earlier.
    verdict_impact: >
      Routed to design_soundness (scene 9, score 2) and claim_reality_coherence
      (advisory). Fix is mechanical and small: an "Awarded from" backlink in the
      contract header plus one narration clause naming the Q2 source.
  scene_8_split_cost_arithmetic:
    question: >
      Do the on-screen prices make the split MORE expensive than single-sourcing?
    answer: "NO — the split is STRICTLY CHEAPER than every alternative."
    arithmetic:
      split_as_awarded:
        maiduguri: "60,000 x 42.29 (Savanna, rank 1) = USD 2,537,400"
        djibo: "20,000 x 41.85 (Faso, rank 1) = USD 837,000"
        total: "USD 3,374,400 — blended 42.1800 / carton over 80,000 cartons"
      single_source_alternatives:
        savanna_both: "2,537,400 + 918,000 = 3,455,400 (blended 43.1925) — +81,000 / +1.0125 per carton"
        kano_both: "2,626,200 + 928,400 = 3,554,600 (blended 44.4325) — +180,200 / +2.2525 per carton"
        lagos_both: "2,747,400 + 946,200 = 3,693,600 (blended 46.1700) — +319,200 / +3.9900 per carton"
        faso_both: "2,918,400 + 837,000 = 3,755,400 (blended 46.9425) — +381,000 / +4.7625 per carton"
      binding_delta: "20,000 x (45.90 - 41.85) = 81,000 = 3,455,400 - 3,374,400 (checks)"
    conclusion: >
      Each lot was awarded to its OWN cheapest bidder, so the split is the global
      cost minimum. It is USD 1.0125 per carton CHEAPER than the best possible
      consolidation, not "a little more". The narration's premise fails too:
      single-sourcing here is both more expensive AND more fragile, so the demo
      shows a free lunch while narrating a sacrifice. A UNICEF/WFP supply officer
      does this subtraction in about three seconds from the ranked table the
      previous scene made them read. It also silently weakens the concept: if
      per-lot award is always cheaper, the lot structure is not buying resilience
      at a price, it is ordinary per-lot competitive tendering.
    verdict_impact: >
      Routed to concept_clarity (scene 8, score 2, CONCEPT/options) and
      why_groundedness (score 3 — the cost clause has no provenance in S4, whose
      rationale is entirely about corridor concentration risk and never mentions
      cost).

fix_recommendation: |
  Six defects set the floor. All but one are small; the deck's craft is better
  than a weakest-link 2 suggests, and the two payoff frames (scene 7's two
  price leaders, scene 8's dual award) are genuinely strong.

  [CONCEPT] Scene 8 — one sentence. "Splitting costs a little more per carton" is
  false by USD 1.0125/carton against the best alternative and by more against
  every other. Either narrate the truth this fixture supports (each corridor's own
  cheapest bidder is a different plant, so the split is simultaneously the
  resilient AND the lowest-cost award — a stronger claim) or re-price Faso's Djibo
  bid above Savanna's so a real premium exists. Also add an award-summary line
  (total value, blended per-carton, supplier exposure) so the cost claim is
  checkable on screen either way. Leave it and the first procurement officer who
  watches does the subtraction and stops trusting the rest.

  [PRODUCT] Scene 9 — surface the Award foreign key. execution.py already models
  Contract-from-Award; the serializer does not expose it and the modal does not
  render it, so the one relation the scene exists to prove is the one it cannot
  show. Add "Awarded from: RUTF Northeast Nigeria Q2 2026 - Lot ... - awarded
  <date>" as a clickable backlink, plus one narration clause naming the Q2 source,
  and the unexplained 60,000-to-45,000 change becomes self-explaining. While in
  there: SHIPPED 54,910 against a 45,000-carton contract is a multi-hop leg
  double-count (9,910 terminal + 45,000 upstream), and DISBURSED 842,000 equals
  exactly 20,000 cartons while the same modal confirms 44,675 — both are
  checkable in two minutes by the exact persona this demo targets.

  [PRODUCT/SCRIPTING] Scenes 2, 3 and 5 — three narrated acts that never happen.
  Ada does not open or name a round (the round pre-existed; "New round" is the
  most prominent control on the page and is never touched). Amina does not apply
  or submit (the demo opens a March 2026 already-Qualified application from round
  2026-A, which is also a different submission from the 2026-B one Tomas reviews
  next — a continuity break with both round labels legible on screen). Ada does
  not filter the registry (all three selects sit at defaults, count reads the
  unfiltered 14). Each is a script fix of a few actions against affordances the
  product already has, and each currently caps two dimensions at 2.

  [PRODUCT] Scene 4 — the payoff frame holds none of the payoff. The per-category
  qualify/reject genuinely fired (all clicks ok:true), but the modal dismisses
  before capture, so the end-frame is a 3-row queue with 55% empty white and a
  content-free "Decision recorded." toast. On record, render a persistent decided
  row: "Savanna Nutrients Ltd — RUTF: Qualified until 19 Jan 2028 - Therapeutic
  milk: Declined". One row fixes concept_clarity, design_soundness,
  claim_reality_coherence and motion_friction at once.

  [CONCEPT] Scene 6 — the eligibility claim is 100% narrated and 0% shown, on a
  frame that is in fact scene 7's payload about 135px of scroll away. The
  walkthrough already switches persona, so the negative case was available: show
  this solicitation ABSENT from the list of a supplier holding only a non-matching
  qualification (Maiduguri Cold Chain Stores — Warehousing only), beside a
  qualified supplier's list where it appears. That also gives scene 6 its own
  subject and stops two consecutive scenes narrating different concepts over one
  screen.

  [CONCEPT/redesign — surfaces as concept_change] use_case_soundness 3. Across the
  deck the feature is exercised where its value is least felt. Nothing in the
  product helps Ada split ON PURPOSE rather than by price reflex, which is exactly
  what scene 8 claims is happening. Add a supplier-concentration/exposure signal,
  and walk lots where price and technical DISAGREE so the technical column changes
  an answer rather than riding along.
