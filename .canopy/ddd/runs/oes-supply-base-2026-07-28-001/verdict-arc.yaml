schema_version: 1
kind: arc
gate: gating
live_state_verified: true
calibration: provisional
rubric_name: ddd-arc-eval
scenes_judged: 9
re_judge_note: >-
  Independent re-judge of the same run dir after a re-render. Previous arc
  verdict was fail / overall 2. Four of the six prior findings are resolved or
  materially improved; two new sequence defects have appeared, one of them
  created by the fix to the old persona finding.
dimensions:
  arc_shape:
    score: 3
    weight: 0.30
    justification: >-
      The causal spine is strong and load-bearing: dashboard -> open a round ->
      supplier applies against a frozen profile -> reviewer qualifies per
      category -> the registry IS those qualifications -> a solicitation drawn
      from it -> bids priced per lot -> two corridors split on camera -> the
      contract with the money behind it. You could not swap any two of scenes
      1-5 or 8-9 without loss. The prior iteration's biggest defect is FIXED: the
      finale now tops the climax. Scene 9 opens contract OES-C-2026-NG1 and shows
      funder US Government, appropriation "FY2026 Famine Prevention Reserve",
      IATI activity US-GOV-1-OES-OES-C-2026-NG1, USD 1,894,500 obligated against
      USD 842,000 disbursed "against confirmed delivery only", and a 16-row
      delivery schedule with real consignment IDs and In transit / Delivered /
      Planned / Confirmed statuses. That is a new artifact class, not a variation
      of the bid table, and it is the strongest frame in the run. Two things hold
      it at 3. (1) The chain visibly breaks at the payoff: scene 8 awards
      Maiduguri 60,000 cartons at USD 42.29 to Savanna, and scene 9's contract is
      45,000 cartons at USD 42.10 -- a different award, with nothing on screen
      saying so, at exactly the moment the narration claims "the award becomes
      the contract". (2) One flat stretch: scenes 6 and 7 are the same
      compare-bids modal at two scroll offsets.
  escalation:
    score: 2
    weight: 0.25
    justification: >-
      Most scenes earn their place, but scenes 6 and 7 are the same surface with
      only a scroll between them -- the rubric's explicit max-2 case. Scene 6's
      final frame is the "RUTF Northeast Nigeria Q3 2026" modal open at the
      Maiduguri lot with the Djibo lot's first row (Faso NutriWorks SA, USD
      41.85, technical 88) already visible at the bottom edge; scene 7's final
      frame is the same modal scrolled down so the rest of that Djibo table
      shows. Scene 7 therefore adds four table rows to a reveal scene 6 has
      already half-made, and scene 6 shows nothing of its own claim -- server-side
      eligibility gating is never depicted in any of the nine frames. Separately,
      scene 4's payoff frame is an absence: the two opposite per-category
      decisions and the expiry it promises are executed in the actions but the
      capture shows only a three-row queue, a "Decision recorded." toast and a
      half-blank page -- strictly less on screen than scene 2, the same surface,
      showed.
  visual_variety:
    score: 3
    weight: 0.20
    justification: >-
      Improved, and no longer dominated end to end by one shape. Scene 1 is
      tiles plus horizontal bars plus a table; scene 3 is a genuinely distinct
      two-column frozen-vs-live prose diff with a certification comparison and a
      "changed since" badge; scene 5 is a filterable full-page registry; scene 9
      is a definition-grid of funding facts over a consignment table. The
      previously fatal empty-map white box no longer appears in ANY final frame
      -- in scene 9 the contract modal covers it, so the "Map unavailable" card
      survives only in the page text and is never the subject of a capture. Still
      capped at 3: six of nine frames are a data table on a white card, and
      scenes 6, 7 and 8 are three consecutive frames of one modal, two of which
      differ only by scroll. The eye habituates across the back half.
  persona_coherence:
    score: 4
    weight: 0.15
    justification: >-
      The prior mismatch is FIXED -- scene 6's header chip now reads
      "Procurement / Ada Nwosu", matching its narration. Every handoff is
      motivated in both narration and chrome: Ada (1-2) -> Amina applying (3,
      chip "Supplier / Savanna Nutrients Ltd") -> Tomas reviewing (4, chip
      "Reviewer / Tomas Berhane") -> Ada for 5 through 9. The narration's subject
      and the screen's evident user agree in all nine scenes. Held at 4 for one
      small thing: scene 3 is narrated as Amina but the screen only ever names
      the organisation, so the person the story follows never appears on the page
      she is supposed to own.
  opening_and_close:
    score: 3
    weight: 0.10
    justification: >-
      Both ends are specific rather than generic, and the close is no longer an
      arbitrary scroll offset -- it delivers a real, dense artifact. But neither
      end lands cleanly. The opening narration describes the pain (knowledge in
      email threads and PDF attachments, the simplest question unanswerable
      without reading) while the opening FRAME shows the solved state: 14
      qualified suppliers, "no near-term expiries", coverage bars by category.
      The screen contradicts the problem being stated over it. And the close
      answers a bigger question than the opening asked -- the opening's literal
      question ("who is qualified to supply RUTF to north-east Nigeria today") is
      answered in scene 5, mid-run -- on a contract that is not the award the
      previous scene just made, so the specific promise "this award becomes the
      contract" is not what is on screen.
overall_score: 2
overall_rule: lowest
one_sentence_story: >-
  Ada turns a folder of emailed PDFs into a queryable supply base -- a supplier
  applies against a profile frozen at submission, a reviewer qualifies them per
  commodity with an expiry, the resulting live qualifications ARE the registry
  that gates who may bid, and the winning bids, split deliberately across two
  corridors, become a contract you can trace from a named appropriation down to
  individual consignments.
verdict: fail
