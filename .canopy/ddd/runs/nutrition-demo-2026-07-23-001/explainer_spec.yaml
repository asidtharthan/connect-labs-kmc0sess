narration:
  generator: manual
  prompt_version: v1
  start_seconds: 0
  by_beat:
    title: Running a wasting program at scale means proving every paid service actually
      happened. Connect lets one manager oversee three programs from a single screen
      — with every screening photo checked by AI on the way in, so a person only judges
      the exceptions. It's the same verification engine we ran for KMC in Nigeria,
      now on child wasting.
    s2: 'Three network managers, four weeks each. Priya checks the same three things:
      were the photos verified, is the flag gating payment, and is each manager running
      the SOP.'
    s3: She opens a resolved week in Central. The panel names the flagged worker and
      links straight to the audit that settled it.
    s4: Behind the cell is Bakary's own weekly review — the per-worker table, the
      MUAC distribution, the SAM and MAM rates.
    s5: She opens the audit and sees the child's MUAC photos herself — each one with
      the auditor's pass-or-fail decision, on a single page.
    s6: She reads the closed coaching conversation, and watches that worker's screening
      numbers recover week over week after the manager stepped in.
    s7: Then the harder cell — a worker still under investigation, with the open audit
      and task named.
    s8: 'The in-review audit: photo cards in mixed states, still waiting on a decision
      for every child.'
    s9: The coaching task is still open, its conversation in progress — an unresolved
      case, readable at a glance.
    s10: 'And this is what makes it affordable. Every image is AI-screened on the
      way in — a hundred here: ninety-four cleared, six flagged for a person. Nobody
      eyeballs them all.'
    s11: Which is how this surfaced. Eastern's flagged cell is a worker the AI caught
      submitting misleading photos — and the outcome was suspension.
    s12: She opens that audit and sees what the AI flagged — a Hyperzoomed badge on
      every photo where the child's arm isn't visible.
    s13: 'Back on the aggregate: Northern meeting the SOP, Central and Eastern below
      — the contrast that decides her week.'
    s14: 'And what it''s all for: one child. Every follow-up visit''s screening photo
      down the left, the MUAC climbing beside it — out of red, through yellow, into
      green. Recovered. The same view catches a child starting to relapse, before
      they fall back.'
    outro: ''
  script: 'Running a wasting program at scale means proving every paid service actually
    happened. Connect lets one manager oversee three programs from a single screen
    — with every screening photo checked by AI on the way in, so a person only judges
    the exceptions. It''s the same verification engine we ran for KMC in Nigeria,
    now on child wasting.

    Three network managers, four weeks each. Priya checks the same three things: were
    the photos verified, is the flag gating payment, and is each manager running the
    SOP.

    She opens a resolved week in Central. The panel names the flagged worker and links
    straight to the audit that settled it.

    Behind the cell is Bakary''s own weekly review — the per-worker table, the MUAC
    distribution, the SAM and MAM rates.

    She opens the audit and sees the child''s MUAC photos herself — each one with
    the auditor''s pass-or-fail decision, on a single page.

    She reads the closed coaching conversation, and watches that worker''s screening
    numbers recover week over week after the manager stepped in.

    Then the harder cell — a worker still under investigation, with the open audit
    and task named.

    The in-review audit: photo cards in mixed states, still waiting on a decision
    for every child.

    The coaching task is still open, its conversation in progress — an unresolved
    case, readable at a glance.

    And this is what makes it affordable. Every image is AI-screened on the way in
    — a hundred here: ninety-four cleared, six flagged for a person. Nobody eyeballs
    them all.

    Which is how this surfaced. Eastern''s flagged cell is a worker the AI caught
    submitting misleading photos — and the outcome was suspension.

    She opens that audit and sees what the AI flagged — a Hyperzoomed badge on every
    photo where the child''s arm isn''t visible.

    Back on the aggregate: Northern meeting the SOP, Central and Eastern below — the
    contrast that decides her week.

    And what it''s all for: one child. Every follow-up visit''s screening photo down
    the left, the MUAC climbing beside it — out of red, through yellow, into green.
    Recovered. The same view catches a child starting to relapse, before they fall
    back.'
