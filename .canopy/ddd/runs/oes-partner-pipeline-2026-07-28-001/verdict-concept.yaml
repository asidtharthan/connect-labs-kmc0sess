fix_recommendation: |
  All six prior findings are fixed, and two scenes (3 and 6) are now genuinely strong — the
  eleven weeks-of-cover values and scene 6's full sample arithmetic were independently
  re-derived and reconcile exactly. The verdict is fail on three new, mostly cheap defects.

  [PRODUCT · blocking] Scene 4 — SHP-2026-0909 is shown as both counted and awaiting-a-count.
  Derive the row's action and the "Awaiting your count" tile from one receipt-status field:
  the row should read "Counted — 60 short" with a link to the discrepancy instead of an active
  "Record the count" button, and the tile should read 9. This is the defect that most directly
  undermines the scene's own thesis.

  [CONCEPT · blocking] Scene 2 — the narration names four specific facts and three are
  falsified by the rendered page (532 cartons not 800; Sundays not Tuesday; the in-frame
  Thursday Kukawa row reads covered; the "nothing assigned" follow-on row does not exist).
  The spec's own show block already matches the screen, so re-narrate from the captured page
  text — "Friday at Askira needs 63 cartons; 38 are on the shelf with 94 more due — at risk.
  Saturday at Biu has nothing assigned at all." — then re-render.

  [PRODUCT/SPEC · blocking] Framing. Retarget scene 2's scroll_to to the card header (or the
  table's thead) with a settle-hold so the title, subtitle, column headers and the named
  exception rows are in frame when they are spoken about; add a capture beat in scene 5 during
  the existing hold while the modal is open, and a scroll_to Kukawa's cover row after the toast
  so the button-to-state change is on camera. Independently, make the table header row and the
  left nav rail sticky — that fixes the headerless continuations in scenes 2 and 4 and reclaims
  ~18% of every frame after scene 1.

  [PRODUCT] Scene 5 — "CHILDREN AFFECTED 94" cannot be reconstructed for Kukawa (its own rows
  book 235; the nearest arithmetic is 235 − 140 = 95) and 94 is exactly what Biu books. Derive
  it from the site's own calendar, show the derivation in an info bubble, and add the CARTONS
  SHORT column the narration names — the Receiving screen already renders that shape.

  [PRODUCT] Scene 4 — make REPORTED BY discriminate (show at least one consignment from the
  machine-to-machine tier) or the provenance marker carries no information, and replace the
  rhetorical card copy with a factual subtitle: on an evidence product the argument should be
  the data, not a sentence.

  [PRODUCT] Scene 6 — add a site column or grouping to the outcome list so clicking the Monguno
  row does not land the viewer on fourteen Dikwa children, and pin one shared y-axis with the
  115/125 mm rules across all 22 sparklines.

  [DEFER] Minor: the runs-dry countdown and the weeks-of-cover column appear to use different
  month constants (Ngala's 4.0 weeks implies 28 days / Aug 25 but shows 27 / Aug 24; Konduga's
  3.0 weeks implies 21 but shows 20). Immaterial to any decision, but a one-day inconsistency
  on a screen whose whole pitch is a defensible derived number.
