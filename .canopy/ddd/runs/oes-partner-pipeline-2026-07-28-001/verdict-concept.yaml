dimensions:
  concept_clarity:
    score: 3
    weight: 0.15
    per_scene: { s1: 3, s2: 3, s3: 4, s4: 3, s5: 3, s6: 3 }
    justification: >
      The spine idea — the organisation that admits the children finally getting an
      instrument for the supply behind them — is legible, and a concrete role is named on
      screen in every scene (the "partner" badge + "Komadugu Health Initiative"). It holds
      at 3 because in four of six scenes an outsider is left with an unanswered question:
      scene 2's table is narrated with its column headers scrolled off, so six numeric
      columns are unlabelled; scene 4's provenance marker reads identically on all twelve
      rows so "hand-keyed as opposed to what?" has no on-screen answer; scene 5's central
      figure (94 children affected) cannot be reconstructed from any Kukawa number on the
      page; scene 6 opens on Dikwa children after the viewer clicked the Monguno row.
      Scene 3 is the exception and earns a 4 — it states its own decision thresholds and
      its full derivation on the face of the card.
  use_case_soundness:
    score: 3
    weight: 0.15
    per_scene: { s1: 4, s2: 4, s3: 4, s4: 3, s5: 3, s6: 4 }
    note: >
      Recorded per rubric. SKILL Step 4 computes overall_score over the five gating dims,
      so this does not move the overall (its minimum is 3 either way).
    justification: >
      The story is not a toy: eleven named sites, twenty-two dated distributions, a real
      0-to-5.5-week cover spread, a live escalation, and a batch resolving to 22 individual
      MUAC series across 511 children fed. A skeptical buyer sees work worth doing. It is
      held at 3 by the two beats that stop one step short of the value they sell — scene 4
      shows a discrepancy as a subtraction and never shows its downstream life (no supplier
      acknowledgement, no dispute state, no place in the ranking its own copy promises), and
      scene 5 sells triage-across-every-other-exception while showing only the partner's own
      two-row list. The pool the ranking ranks within is never on camera.
  design_soundness:
    score: 2
    weight: 0.20
    per_scene: { s1: 3, s2: 3, s3: 3, s4: 2, s5: 3, s6: 3 }
    justification: >
      Scene 4 breaks the product's own logic on the consignment the whole scene is about.
      SHP-2026-0909 is simultaneously counted (840 recorded, a 60-carton discrepancy raised,
      and 840 booked as Monguno's on-hand on the sites page) and awaiting a count (status
      "Delivered", an active "Record the count" button, and included in the "10 Awaiting your
      count" tile, which is therefore over by one). A first-time user reproducing the flow
      would press "Record the count" on a consignment the app has already counted, and this
      directly undercuts the scene's own thesis that the difference "becomes a discrepancy
      the moment it is recorded". Elsewhere the model holds: the raise flow in scene 5 is
      genuinely well built (per-row action, a modal pre-filled from the site's own projection,
      an explicit submit, a toast, and the button mutating to "Raised Jul 28, 2026" so the
      same shortfall cannot be raised twice), and the calendar/cover-table divergence is
      disclosed in the product's own copy rather than hidden.
  visual_polish:
    score: 3
    weight: 0.12
    per_scene: { s1: 3, s2: 3, s3: 3, s4: 3, s5: 3, s6: 3 }
    justification: >
      Consistent, restrained and genuinely competent table craft — clean numerals, consistent
      card shells, tight column alignment, adequate contrast, host-product chrome intact and
      grounding. It sits at 3 in every scene on real designer notes rather than any single
      failure: numeric columns are left-aligned throughout so magnitudes cannot be compared
      down a column (38 above 1,635); the left nav rail is not sticky, so roughly 230px
      (~18% of the frame) is empty white in scenes 2-6 and a long page loses its navigation;
      scene 3's colour bands (red under 2, amber 2-4, green 4+) do not match the only
      thresholds the card states ("at four weeks you plan; at one you triage") and have no
      legend; scene 4's card copy editorialises the narrator's argument at its own user
      ("A shortfall asserted from a spreadsheet is an opinion. This one was counted beside
      the pallets.") and paints twelve identical amber pills over an invariant field; scene 6
      gives 21 of 22 sparklines no axis reference while inviting cross-row comparison.
  why_groundedness:
    score: 4
    weight: 0.15
    per_scene: { s1: 4, s2: 4, s3: 4, s4: 4, s5: 4, s6: 4 }
    justification: >
      The strongest dimension in the run, and consistently so. Every scene names a non-empty
      provenance (S0-S5), and each concept_claim maps clause-for-clause onto its spine item —
      S1's "the partner's unit of planning is a distribution day at a named site with a known
      number of children expected" is literally the built column set; S2's decision rule
      appears verbatim in the card subtitle with the derivation in the footnote; S3's "a
      discrepancy recorded at the loading bay is evidence" is restated in the product's own
      copy and instantiated by real fields (YOU COUNTED, the partner badge, the named despatch
      advice); S4's upward-reporting inversion appears as UI copy, not just narration. It is
      held off 5 because several spine limbs rest on assumed rather than demonstrated evidence:
      "a partner storekeeper with a phone is the realistic capture device" (nothing
      phone-shaped appears anywhere in the run), "no partner in this sector currently gets it
      as a live figure", and "these are the same figures the OES command centre reads" — all
      asserted, none evidenced.
  claim_reality_coherence:
    score: 2
    weight: 0.10
    blocking: false
    advisory: true
    per_scene: { s1: 3, s2: 2, s3: 4, s4: 2, s5: 2, s6: 4 }
    justification: >
      Advisory, and the loudest signal in the run. Scene 2's narration was written against
      different data than what rendered: it says Monguno "needs eight hundred cartons" when
      the row requires 532 (840 is the STOCK column — supply quoted as demand); it says "next
      Tuesday" when Monguno's two distributions fall on Aug 2 and Aug 9, both Sundays; it says
      the Thursday Kukawa row "reads as at risk" when the in-frame Aug 6 Kukawa row reads
      covered; and it says "the one after it has nothing assigned to it at all" when no such
      row exists (the only uncovered row on the page is Biu, Aug 1). The spec's own show block
      matches the screen exactly, so the drift is in the VO, not the data. Scene 5 narrates
      four record fields when the resulting record carries three (no cartons-short column),
      and narrates a command-centre ranking and a partner-raised marker that appear nowhere.
      Scene 4 narrates a receipt being recorded "from a phone" over a desktop table where no
      receipt is recorded on camera. Against that, scenes 3 and 6 are exemplary: all eleven
      weeks-of-cover values reconcile exactly to the stated method, and scene 6's modal
      arithmetic ties out at every level (280 + 231 = 511 fed; 14 + 8 = 22 sampled; counting
      the status pills gives exactly the stated 18 recovered).
  motion_friction:
    score: 2
    weight: 0.13
    per_scene: { s1: 3, s2: 2, s3: 4, s4: 3, s5: 2, s6: 4 }
    justification: >
      A run-wide framing pattern, not a product problem. Scene 2's scroll_to overshot the
      Distribution calendar card and landed mid-table, putting the card title, the reconciling
      subtitle, the entire column-header row and the Askira at-risk row the spec itself names
      all above the viewport — the scene narrates over six unlabelled numeric columns. Scene 5
      never captures its modal at all: the before-frame is the previous scene's Receiving page,
      so the pair brackets the navigation rather than the act, and the scene's densest narration
      (site, date, children affected, cartons short, "pre-filled from the site's own projection")
      has no frame behind it; the one element that visibly changed — Kukawa's button becoming
      "Raised Jul 28, 2026" — is scrolled off the top. Scene 4 opens on a headerless table
      continuation. Scenes 3 and 6 show how it should be done: scene 3 lands all eleven rows
      plus the method footnote settled in one viewport, and scene 6's before/after pair captures
      a large, unambiguous change that is exactly the narrated act.

