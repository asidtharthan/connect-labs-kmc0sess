schema_version: 1
kind: arc
gate: gating
live_state_verified: true
calibration: provisional
rubric_name: ddd-arc-eval
scenes_judged: 6
iteration: 4
judged_at: "2026-07-28"
independence: >-
  Judged by an agent that did not author, build or render this narrative.
  Corroborated by a second blind judge given only the six PNGs, the narration
  and the rubric; that judge returned 2 / 2 / 2 / 4 / 3 and independently
  identified scenes 1-2 as the same frame with only the cursor moved.
render_gate:
  snapshot_consistency: "pass (6 scenes) — every snapshot came from one render"
  spec: docs/walkthroughs/oes-partner-pipeline.recipe.yaml
dimensions:
  arc_shape:
    score: 2
    weight: 0.30
    justification: >-
      The story is statable in one sentence and the finale is correctly the
      strongest moment, so the intended shape is sound. But scenes 1 and 2 are
      STILL the same frame. A numpy diff of scene_1.png against scene_2.png
      finds 1,947 differing pixels (0.32%) in exactly two clusters —
      y50-150/x150-250 and y300-350/x700-800 — both of them the mouse cursor.
      Zero other pixels differ. The rubric caps at 2 for "two adjacent scenes
      make the same point with different pixels"; these do not manage different
      pixels. The rebuilt week-grid calendar is a real improvement in kind, but
      it is fully framed already in scene 1 (card title at y=306, six site rows
      and seven day columns visible), so scene 2's scroll_to on the card h2 is a
      no-op for the second iteration running. Scenes 3 through 6 build correctly
      and cannot be reordered without loss.
  escalation:
    score: 2
    weight: 0.25
    justification: >-
      Scene 2 is removable at literally zero visual cost, because its frame IS
      scene 1's frame. That is worse than the rubric's max-2 rule ("two scenes
      showing the same surface with only a scroll between them") — there is not
      even a scroll. Scenes 3, 4, 5 and 6 each add something no other scene
      shows: per-site runway and the run-dry date, the counted discrepancy
      against the advice, the raise landing as a dated open record, and the MUAC
      series. The defect is one scene, not systemic.
  visual_variety:
    score: 2
    weight: 0.20
    justification: >-
      Four of six frames (1, 2, 3, 5) are the partner surface at scroll offsets
      of one long page, and two of those four are the SAME offset — the rubric's
      "more than half the scenes are the same surface at different scroll
      offsets: max 2". This is not the single-route-SPA exemption: scenes 4
      (Receiving tab) and 6 (batch modal, five MUAC sparklines against the WHO
      red/amber/green bands) share the same URL and look nothing alike, which
      proves the product has other shapes to reach for. Measured diffs: 1v2
      0.32%, 3v5 20.5%, 3v4 24.4%, 1v6 66.9%. The week grid is a genuine new
      shape versus the old date-sorted table; it is just spent twice on one frame.
  persona_coherence:
    score: 3
    weight: 0.15
    justification: >-
      One persona and one goal across all six frames, with the partner badge and
      "Komadugu Health Initiative" in every header, so the viewer never loses
      whose screen this is. Held at the default because scene 4's narration is a
      different human doing a different thing — "the storekeeper counts what came
      off it and records the receipt from a phone" — over a 1280px desktop
      consignment table with "Record the count" buttons. Zara's goal drifts to
      storekeeper-capture and back with nothing on screen motivating the hand-off.
      (The blind cross-check scored this 4, deducting instead for no screen ever
      attributing anything to a named person.)
  opening_and_close:
    score: 4
    weight: 0.10
    justification: >-
      The close is the best thing in the run and it delivers exactly what the
      opening promised — the org that touches both the carton and the child
      finally holding them as one record — and it is honest while doing it:
      DIK-2607-013 climbing 98 to 128 mm, DIK-2607-008 left visible as Non
      Response at 102 to 102 mm, the synthetic label and the "22 of the 511
      children this batch fed" interval caveat all in the same frame. The
      opening is merely adequate: the narration states the problem, but the
      opening FRAME is already the solved dashboard, so nothing on screen shows
      the pain being described. (Blind cross-check: 3, deducting further because
      the opening frame is spent twice.)
overall_score: 2
overall_rule: lowest
one_sentence_story: >-
  A partner NGO that admits the children finally gets an instrument for the
  supply behind them — inbound consignments in its own distribution calendar,
  weeks of cover and a run-dry date per site, a short count recorded at the
  loading bay, a shortfall raised upward into the centre, and a received batch
  followed all the way to one child's arm circumference crossing into green.
verdict: fail
prior_finding_status:
  scenes_1_2_pixel_duplicates: not_resolved
  scene_4_modal_occludes_its_own_evidence: resolved
  scene_5_leaks_the_batch_card: partial
  visual_variety_four_of_six_one_dashboard: partial
  non_sticky_nav_dead_whitespace: partial
