narration:
  generator: manual
  prompt_version: v1
  start_seconds: 0
  by_beat:
    title: Connect lets one person oversee several programs at once and act on all
      of them from a single place — confident that every service being paid for has
      actually been verified. Here, one manager oversees three network managers running
      RUTF distribution and weekly MUAC screening. From one screen she checks each
      manager's SOP compliance, opens a flagged worker's audited photos and the coaching
      that followed, and tracks an individual child's recovery — every number backed
      by the verified visit behind it.
    s2: Priya opens the Program Admin Report and sees all three network managers on
      one grid — four weeks each, with an aggregate that calls out who is meeting
      the screening SOP. Northern is clean; Central and Eastern both read below.
    s3: She clicks a resolved week in Central's row. An inline panel names the worker
      who was flagged — Kadi Fofana — and links straight to the audit and the coaching
      task that dealt with it, without leaving the report.
    s4: She opens the review behind the cell — Bakary's own weekly nutrition review,
      the per-worker table with its MUAC distribution and SAM and MAM rates, its action
      buttons now reporting what was already done.
    s5: She opens the audit and sees the child's MUAC photos herself — each screened
      child's assessment photo with the auditor's pass-or-fail decision, all on one
      page.
    s6: She reads the closed coaching conversation — the full transcript on the task
      — and watches that worker's screening numbers recover week over week after the
      manager stepped in.
    s7: Then the harder cell. Central's still-open week separates a worker whose case
      is closed from one still under investigation, naming the specific open audit
      and task.
    s8: She opens the in-review audit — MUAC photo cards in mixed states, still reading
      Save Progress rather than Complete Image Review until every child's photo has
      a decision.
    s9: The coaching task is still open — its conversation in progress and the Close
      Task action still available, so the state of an unresolved case is readable
      straight from the task.
    s10: 'The third manager. Eastern''s flagged cell surfaces a worker the AI image
      review caught submitting misleading MUAC photos — a different fate from a coached-to-close
      flag or an open case: suspended.'
    s11: She opens that audit and sees what the AI flagged — the reviewer's own per-photo
      verdict, a Hyperzoomed badge on the photos where the child's arm isn't visible,
      so she is verifying the machine's finding against the images, not just a status
      label.
    s12: She lands back on the aggregate — Northern meeting the SOP, Central and Eastern
      below, each with runs, flags, and outcomes side by side — the contrast that
      decides where her week goes.
    s13: And to see what all that oversight is ultimately for, she follows one child.
      The SAM follow-up timeline drills to a single child's MUAC climbing across eight
      visits — out of red, through yellow, into green. Recovered.
    outro: ''
  script: 'Connect lets one person oversee several programs at once and act on all
    of them from a single place — confident that every service being paid for has
    actually been verified. Here, one manager oversees three network managers running
    RUTF distribution and weekly MUAC screening. From one screen she checks each manager''s
    SOP compliance, opens a flagged worker''s audited photos and the coaching that
    followed, and tracks an individual child''s recovery — every number backed by
    the verified visit behind it.

    Priya opens the Program Admin Report and sees all three network managers on one
    grid — four weeks each, with an aggregate that calls out who is meeting the screening
    SOP. Northern is clean; Central and Eastern both read below.

    She clicks a resolved week in Central''s row. An inline panel names the worker
    who was flagged — Kadi Fofana — and links straight to the audit and the coaching
    task that dealt with it, without leaving the report.

    She opens the review behind the cell — Bakary''s own weekly nutrition review,
    the per-worker table with its MUAC distribution and SAM and MAM rates, its action
    buttons now reporting what was already done.

    She opens the audit and sees the child''s MUAC photos herself — each screened
    child''s assessment photo with the auditor''s pass-or-fail decision, all on one
    page.

    She reads the closed coaching conversation — the full transcript on the task —
    and watches that worker''s screening numbers recover week over week after the
    manager stepped in.

    Then the harder cell. Central''s still-open week separates a worker whose case
    is closed from one still under investigation, naming the specific open audit and
    task.

    She opens the in-review audit — MUAC photo cards in mixed states, still reading
    Save Progress rather than Complete Image Review until every child''s photo has
    a decision.

    The coaching task is still open — its conversation in progress and the Close Task
    action still available, so the state of an unresolved case is readable straight
    from the task.

    The third manager. Eastern''s flagged cell surfaces a worker the AI image review
    caught submitting misleading MUAC photos — a different fate from a coached-to-close
    flag or an open case: suspended.

    She opens that audit and sees what the AI flagged — the reviewer''s own per-photo
    verdict, a Hyperzoomed badge on the photos where the child''s arm isn''t visible,
    so she is verifying the machine''s finding against the images, not just a status
    label.

    She lands back on the aggregate — Northern meeting the SOP, Central and Eastern
    below, each with runs, flags, and outcomes side by side — the contrast that decides
    where her week goes.

    And to see what all that oversight is ultimately for, she follows one child. The
    SAM follow-up timeline drills to a single child''s MUAC climbing across eight
    visits — out of red, through yellow, into green. Recovered.'
