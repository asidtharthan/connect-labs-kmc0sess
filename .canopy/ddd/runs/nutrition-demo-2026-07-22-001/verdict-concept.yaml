dimensions:
  concept_clarity:
    score: 5
    weight: 0.15
    justification: >
      A smart outsider can state in one sentence what the product does and why it
      matters: one grid showing which of a program's network managers ran the weekly
      MUAC-review SOP and coached flagged workers, drillable from any cell to the
      network manager's own review, the flagged worker's audited child-MUAC photos, and
      the AI coaching transcript. Named users/roles throughout (Priya the program
      manager; Amara/Bakary/Chidi network managers; Kadi/Lola/Vida FLWs). Scene 1 opens
      on the whole program and the SOP MET vs BELOW aggregate establishes the triage
      problem before any number is read.
  use_case_soundness:
    score: 5
    weight: 0.15
    justification: >
      Load-bearing, non-trivial use at real scale (3 opportunities x 4 weeks x 11 FLWs
      each). A skeptical buyer sees the rollup replace manually cross-referencing a
      dozen weekly reviews plus audits plus coaching tasks, and the drill-to-primary-
      records (audit photos, coaching transcripts) makes it verifiable evidence rather
      than a summary. The three distinct fates (coached-to-close, open investigation,
      AI-caught suspension) show the feature doing the work where its value is felt.
  design_soundness:
    score: 5
    weight: 0.20
    justification: >
      Every interaction shown is coherent: cell click opens an inline detail panel with
      no page navigation; 'Open the run' lands on the weekly review; the Actions column
      is state-aware (View Audit/View Task where records exist vs Create menus
      elsewhere); View Audit/View Task/Task # links reach the primary records. No dead
      ends, no contradictory affordances, no unexplained error states. All must_succeed
      actions completed (47/47 ok).
  visual_polish:
    score: 4
    weight: 0.12
    justification: >
      Clean, consistent, shippable: clear type hierarchy, semantic color (green SOP MET,
      amber BELOW, red FAIL/green PASS), tidy grid, breathing whitespace; the Connect
      Labs host chrome grounds it as a real product. One minor issue holds it off 5: on
      the drilled weekly-review table (scene 3) the far-right state-aware Actions column
      is clipped at a 1440px viewport (View Task reads 'View Ta'), which a designer would
      note even though the primary flagged-row content and View Audit are fully legible.
  why_groundedness:
    score: 5
    weight: 0.15
    justification: >
      Every scene's concept_claim traces to a named why_brief spine item (S1 grid
      overview; S2 in-place drill to review/photos/coaching; S3 the three distinct fates;
      S4 ending on the child's MUAC evidence + coaching recovery) with matching
      rationale. Provenance present on every scene, none empty. The one assumed element
      (a dedicated per-child MUAC-trajectory dashboard) is honestly disclosed as gap G1
      (CAPABILITY) and is never claimed on screen — the demo shows only the grounded
      evidence (photos + coaching outcome).
  claim_reality_coherence:
    score: 3
    weight: 0.10
    blocking: false
    justification: >
      Most claims are demonstrated exactly (grid SOP MET/BELOW, inline panels naming
      workers + linked records, real MUAC audit photos with per-photo pass/fail, coaching
      transcript showing the recovery week-over-week, the suspended/closed-fraud pill).
      One material discrepancy on scene 10: Vida's audit badges all 5 photos 'Hyperzoomed'
      with high AI confidence, but inspecting the images only ~2 are literally hyperzoomed
      (tape window fills frame, no arm context); the other ~3 show finger obstruction,
      backlight glare, or tape mispositioning where the arm IS partly visible. The
      overall finding (AI-caught misleading photos -> all fail -> suspension) is true and
      the human note 'framing makes the reading impossible to verify' is accurate, but the
      uniform 'Hyperzoomed' label overclaims a single defect category, so 'verify the
      machine's finding against the images' does not literally hold for 3/5 photos. Advisory;
      excluded from the weakest-link overall_score.
  motion_friction:
    score: 4
    weight: 0.13
    justification: >
      Flow is smooth: scenes settle before content, generous wait_fors, no dead-air or
      silent-motion (pacing audit clean, 0 recording bugs). Held off 5 by one framing
      miss on scene 3: the narration explicitly calls out 'View Audit and View Task
      buttons' but the scene scrolls only vertically to the flagged row, leaving the
      far-right Actions column horizontally clipped so View Task is cut to 'View Ta'. The
      drilled records in scenes 4/5/7/8/10 are reached via direct goto rather than a
      visible click on the panel link, though the linking affordance was shown in the
      panels (scenes 2/6/9).

overall_score: 4
overall_rule: lowest

verdict: pass
blocking_reason: null

fix_recommendation: |
  Concept is sound and converged (overall 4/5, weakest-link). Two non-blocking items:
  [DEFER/advisory] Scene 10 claim_reality: the 'Hyperzoomed' badge is applied uniformly
    to all 5 of Vida's audit photos, but only ~2 are literally hyperzoomed; 3 show other
    framing defects (finger obstruction / glare / tape mispositioning). Options to align
    claim to reality: (a) re-seed Vida's audit with a bounded 2-photo pure-hyperzoom
    corpus so every badge matches; (b) relabel the 3 non-hyperzoom photos to their true
    AI defect category; or (c) soften the scene-10 narration/claim to 'framing-flagged'
    rather than 'Hyperzoomed'. Operator pre-scoped fix (a). Advisory only.
  [PRODUCT/options] Scene 3 framing: the state-aware Actions column is clipped at the
    viewport. Options: horizontally scroll the scene to frame both View buttons (scene
    edit) vs make the product's Actions column sticky/compact (labs change) vs accept as
    normal wide-table behavior.
